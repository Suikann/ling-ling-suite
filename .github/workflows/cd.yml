# 推送 v* 標籤時建出 Windows 的 LingLingSuite-portable.zip 與 Linux 的 LingLingSuite-x86_64.AppImage（附 .zsync），
# 兩者都建好才放進同一個 GitHub 發行版。workflow_dispatch 只建置、上傳成工作產物，不建發行版。
# action 以 commit SHA 釘住；建置工作只給 contents: read，只有建發行版的工作有 contents: write。
name: CD - Build Portable EXE and AppImage

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions: {}

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 從分支觸發時以 git describe 推版號，要有完整歷史與 tag
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run tests before build
        run: |
          pip install pytest
          python -m pytest tests/ -v --tb=short

      # 寫到 repo 根目錄，由 LingLingSuite.spec 收進資源目錄的根層
      - name: Write Google client secret
        env:
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -z "$GOOGLE_CLIENT_SECRET" ]; then
            echo "::error::GOOGLE_CLIENT_SECRET is empty"
            exit 1
          fi
          printf '%s' "$GOOGLE_CLIENT_SECRET" > client_secret.json
        shell: bash

      # 寫到 repo 根目錄，由 LingLingSuite.spec 收進資源目錄的根層，「關於」顯示它。
      # 由 tag 觸發（含 workflow_dispatch 選了 tag）時就是該 tag；從分支觸發時是 git describe 的結果
      - name: Write version file
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            printf '%s\n' "$GITHUB_REF_NAME" > version.txt
          else
            git describe --tags --always > version.txt
          fi
          cat version.txt
        shell: bash

      - name: Build portable EXE
        run: pyinstaller --noconfirm LingLingSuite.spec

      - name: Create ZIP archive
        run: |
          cd dist
          Compress-Archive -Path LingLingSuite -DestinationPath LingLingSuite-portable.zip
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: LingLingSuite-portable
          path: dist/LingLingSuite-portable.zip
          if-no-files-found: error

  # 在 ubuntu-24.04 上建置，AppImage 的 glibc 下限因此是 2.39
  linux:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 從分支觸發時以 git describe 推版號，要有完整歷史與 tag
          fetch-depth: 0
          persist-credentials: false

      # 測試自設 QT_QPA_PLATFORM=offscreen，不需 xvfb；只補 Qt 載入時要的函式庫（與 CI 相同）
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run tests before build
        run: |
          pip install pytest
          python -m pytest tests/ -v --tb=short

      # 寫到 repo 根目錄，由 LingLingSuite.spec 收進資源目錄的根層
      - name: Write Google client secret
        env:
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -z "$GOOGLE_CLIENT_SECRET" ]; then
            echo "::error::GOOGLE_CLIENT_SECRET is empty"
            exit 1
          fi
          printf '%s' "$GOOGLE_CLIENT_SECRET" > client_secret.json

      # 與 Windows 工作相同：tag 觸發時是該 tag，從分支觸發時是 git describe 的結果
      - name: Write version file
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            printf '%s\n' "$GITHUB_REF_NAME" > version.txt
          else
            git describe --tags --always > version.txt
          fi
          cat version.txt

      - name: Build folder version
        run: pyinstaller --noconfirm LingLingSuite.spec

      - name: Build AppImage
        run: bash scripts/build_appimage.sh

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: LingLingSuite-AppImage
          path: |
            dist/LingLingSuite-x86_64.AppImage
            dist/LingLingSuite-x86_64.AppImage.zsync
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release
          merge-multiple: true

      # AppImage 內嵌的更新資訊找的是 latest：預發行版不算 latest，已安裝的 AppImage 會檢查不到新版
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            release/LingLingSuite-portable.zip
            release/LingLingSuite-x86_64.AppImage
            release/LingLingSuite-x86_64.AppImage.zsync
          prerelease: false
          fail_on_unmatched_files: true
          generate_release_notes: true
