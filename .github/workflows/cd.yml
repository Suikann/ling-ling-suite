name: CD - Build Portable EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run tests before build
        run: |
          pip install pytest
          python -m pytest tests/ -v --tb=short

      - name: Build portable EXE
        shell: cmd
        run: >
          pyinstaller --noconfirm --onedir --windowed
          --name "LingLingSuite"
          --add-data "src\assets;assets"
          --hidden-import PySide6.QtSvg
          --icon NONE
          src\main.py

      - name: Create ZIP archive
        run: |
          cd dist
          Compress-Archive -Path LingLingSuite -DestinationPath LingLingSuite-portable.zip
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LingLingSuite-portable
          path: dist/LingLingSuite-portable.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LingLingSuite-portable.zip
          generate_release_notes: true
