name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Verify imports
        run: |
          cd src
          python -c "from core.models import Project, Group, FileInfo"
          python -c "from core.naming import NamingSettings, name_group, name_slot, settings_for"
          python -c "from core.locale import t, set_locale, get_locale"
          python -c "from services.rename_service import generate_rename_plan"
          python -c "from services.project_service import ProjectService"
          python -c "from services.move_history import MoveHistory, MoveResult, RenameVerdict"

      - name: "[DEBUG-wsh] GIL probe"
        run: python tests/wsh_gil_probe.py
        timeout-minutes: 4
        continue-on-error: true

      - name: "[DEBUG-wsh] split dialog tests alone"
        run: python -m pytest tests/test_split_dialog.py -v -s -x --tb=long -p no:cacheprovider -o faulthandler_timeout=60
        timeout-minutes: 4
        continue-on-error: true

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short -o faulthandler_timeout=120 --cov=src --cov-report=term-missing
        timeout-minutes: 8

      - name: Syntax check all Python files
        run: python -m py_compile src/main.py
