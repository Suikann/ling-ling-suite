name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      # 測試自設 QT_QPA_PLATFORM=offscreen，不需 xvfb；只補 Qt 載入時要的函式庫
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Verify imports
        run: |
          cd src
          python -c "from core.models import Project, Group, FileInfo"
          python -c "from core.naming import NamingSettings, name_group, name_slot, settings_for"
          python -c "from core.locale import t, set_locale, get_locale"
          python -c "from services.rename_service import generate_rename_plan"
          python -c "from services.project_service import ProjectService"
          python -c "from services.move_history import MoveHistory, MoveResult, RenameVerdict"

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short -o faulthandler_timeout=120 --cov=src --cov-report=term-missing

      - name: Syntax check all Python files
        run: python -m py_compile src/main.py
