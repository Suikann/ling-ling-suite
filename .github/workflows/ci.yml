name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Verify imports
        run: |
          cd src
          python -c "from core.models import Project, Group, FileInfo"
          python -c "from core.template_engine import substitute_template, build_variables_for_file"
          python -c "from core.locale import t, set_locale, get_locale"
          python -c "from services.rename_service import RenameService"
          python -c "from services.project_service import ProjectService"
          python -c "from services.undo_service import UndoService"

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short --cov=src --cov-report=term-missing

      - name: Syntax check all Python files
        run: python -m py_compile src/main.py
